# Publishes the public website to GitHub Pages on every push to main.
#
# This deploys the marketing site only. The CMS portal needs a server for
# authentication and writes, so `npm run build:static` sets it aside — see
# scripts/build-static.mjs. For the portal and working enquiry forms, deploy the
# default build target to a Node host instead.
name: Deploy website to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than cancel, so a
# push never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Served from the root of the custom domain, not from /<repo>, so
          # there is no base path. public/CNAME is what tells GitHub Pages
          # which domain this artifact belongs to; both must agree.
          PAGES_BASE_PATH: ""
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://leikahgroup.co.za
        run: npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
